name: Django CI

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Сервіси, які потрібні для тестів (PostgreSQL та Redis)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        # Передаємо тестові змінні оточення для GitHub Actions
        DJANGO_SETTINGS_MODULE: config.settings.dev
        SECRET_KEY: fake-secret-key-for-ci
        DEBUG: "True"
        DJANGO_DEBUG: "True"
        ALLOWED_HOSTS: "*"
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        CELERY_BROKER_URL: redis://localhost:6379/0
        LIQPAY_PUBLIC_KEY: sandbox_test_key
        LIQPAY_PRIVATE_KEY: sandbox_test_key
        LIQPAY_SANDBOX: 1
        NOVA_POSHTA_API_KEY: test_api_key
      run: |
        pytest --cov=cart --cov=delivery --cov=orders --cov=products --cov=payments